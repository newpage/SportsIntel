name: SportsIntel CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements-dev.txt

      - name: Compile Python sources and tests
        run: python -m compileall -q apps/api/app apps/api/tests

      - name: Run non-PostgreSQL tests
        env:
          PYTHONPATH: apps/api
          NFL_SNAPSHOT_STORE: memory
        run: pytest -q --ignore=apps/api/tests/test_postgres_snapshot_store.py --junitxml=backend-test-results.xml

      - name: Upload backend failure results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ github.run_id }}
          path: backend-test-results.xml
          if-no-files-found: ignore

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sportsintel_ci
          POSTGRES_USER: sportsintel_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sportsintel_ci -d sportsintel_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: sportsintel_ci
      PGUSER: sportsintel_ci
      PGPASSWORD: ci-only-password
      TEST_DATABASE_URL: postgresql://sportsintel_ci:ci-only-password@127.0.0.1:5432/sportsintel_ci
      PYTHONPATH: apps/api
      NFL_SNAPSHOT_STORE: memory
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install API dependencies
        run: python -m pip install --disable-pip-version-check -r apps/api/requirements-dev.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            pg_isready && exit 0
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)"
            sleep 2
          done
          exit 1

      - name: Apply snapshot schema
        run: psql --set=ON_ERROR_STOP=1 --file=db/init/001_nfl_prediction_snapshots.sql

      - name: Verify snapshot table
        run: |
          table_name=$(psql --tuples-only --no-align --command "SELECT to_regclass('public.nfl_prediction_snapshots')")
          test "${table_name}" = "nfl_prediction_snapshots"

      - name: Run PostgreSQL integration tests
        run: pytest -q apps/api/tests/test_postgres_snapshot_store.py --junitxml=postgres-test-results.xml

      - name: Upload PostgreSQL failure results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-test-results-${{ github.run_id }}
          path: postgres-test-results.xml
          if-no-files-found: ignore

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type-check frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Build frontend
        working-directory: apps/web
        env:
          SPORTSINTEL_INTERNAL_API_URL: http://127.0.0.1:8300
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  docker-validation:
    name: Docker validation
    runs-on: ubuntu-latest
    env:
      API_PORT: "8300"
      WEB_PORT: "3300"
      POSTGRES_PORT: "55432"
      POSTGRES_DB: sportsintel_ci_smoke
      POSTGRES_USER: sportsintel_ci
      POSTGRES_PASSWORD: ci-only-password
      NFL_SNAPSHOT_STORE: postgres
      DATABASE_URL: postgresql://sportsintel_ci:ci-only-password@postgres:5432/sportsintel_ci_smoke
      SPORTSINTEL_INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: /api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API and web images
        run: docker compose build api web

      - name: Start Compose stack
        run: docker compose up --detach

      - name: Wait for API health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8300/health > /tmp/api-health.json; then
              exit 0
            fi
            echo "Waiting for API health (attempt ${attempt}/60)"
            sleep 2
          done
          exit 1

      - name: Verify persistent snapshot-store health
        run: |
          python -c 'import json; data=json.load(open("/tmp/api-health.json")); assert data["application"]["status"] == "healthy"; assert data["postgresql"]["configured"] is True; assert data["version"]; assert data["environment"] == "development"'
          curl --fail --silent --show-error \
            http://127.0.0.1:8300/api/sports/nfl/snapshot-store/health \
            > /tmp/snapshot-store-health.json
          python -c 'import json; data=json.load(open("/tmp/snapshot-store-health.json")); assert data["snapshot_store_type"] == "postgres"; assert data["snapshot_persistence"] is True; assert data["database_reachable"] is True; assert data["snapshot_table_reachable"] is True'

      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deployment-validation:
    name: Production deployment assets
    runs-on: ubuntu-latest
    env:
      SPORTSINTEL_ENV_FILE: /opt/sportsintel/shared/production.env
      COMPOSE_PROJECT_NAME: sportsintel-ci-production
      API_PORT: "18300"
      WEB_PORT: "13300"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm clean host starts incomplete
        run: |
          if deploy/linux/install.sh --check-only; then
            echo "Runner image already contains all host prerequisites"
          else
            echo "Clean-host prerequisite gap detected as expected"
          fi

      - name: Install deployment validators
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck apache2 apache2-utils openssl

      - name: Prepare clean deployment host
        run: |
          git clone --bare --no-hardlinks "$GITHUB_WORKSPACE" /tmp/sportsintel-ci-source.git
          chmod -R a+rX /tmp/sportsintel-ci-source.git
          sudo deploy/linux/install.sh --admin-user "$USER"
          sudo -iu sportsintel -- git clone /tmp/sportsintel-ci-source.git /opt/sportsintel/app
          sudo -iu sportsintel -- git -C /opt/sportsintel/app checkout "$GITHUB_SHA"
          sudo -iu sportsintel -- test -w /opt/sportsintel/app
          sudo -iu sportsintel -- test -w /opt/sportsintel/shared
          sudo -iu sportsintel -- test -w /opt/sportsintel/.docker
          sudo -iu sportsintel -- test -w /opt/sportsintel/.config

      - name: Create restricted CI production environment
        run: |
          umask 027
          cat > /tmp/sportsintel-ci-production.env <<'EOF'
          SPORTSINTEL_ENV=production
          COMPOSE_PROJECT_NAME=sportsintel-ci-production
          API_PORT=18300
          WEB_PORT=13300
          SPORTSINTEL_VERSION=ci-preview
          SPORTSINTEL_BUILD_TIMESTAMP=2026-01-01T00:00:00Z
          SPORTSINTEL_GIT_COMMIT=ci-validation
          SPORTSINTEL_ADMIN_KEY=ci-only-admin-key-0123456789abcdef
          SPORTSINTEL_CORS_ORIGINS=https://preview.example.test
          SPORTSINTEL_PUBLIC_RATE_LIMIT=60
          SPORTSINTEL_ADMIN_RATE_LIMIT=20
          SPORTSINTEL_TRUST_PROXY_HEADERS=true
          SPORTSINTEL_PUBLIC_URL=https://127.0.0.1:18443
          NFL_SNAPSHOT_STORE=postgres
          DATABASE_URL=postgresql://sportsintel_ci:ci-only-password@postgres:5432/sportsintel_ci
          POSTGRES_DB=sportsintel_ci
          POSTGRES_USER=sportsintel_ci
          POSTGRES_PASSWORD=ci-only-password
          SPORTSINTEL_INTERNAL_API_URL=http://api:8000
          NEXT_PUBLIC_API_URL=/api
          PREDICTION_HISTORY_FILE=/app/data/prediction_history.json
          EOF
          sudo install -o root -g sportsintel -m 0640 /tmp/sportsintel-ci-production.env "$SPORTSINTEL_ENV_FILE"

      - name: Validate shell assets
        run: |
          shellcheck deploy/linux/*.sh deploy/linux/lib/*.sh deploy/apache/create-preview-user.sh
          deploy/tests/validate-deployment.sh
          deploy/tests/test-first-deployment.sh

      - name: Validate Apache template directives
        run: |
          grep -q 'AuthType Basic' deploy/apache/sportsintel.conf.example
          grep -q 'ProxyPass.*127.0.0.1:8300' deploy/apache/sportsintel.conf.example
          grep -q 'SSLEngine on' deploy/apache/sportsintel.conf.example

      - name: Validate production Compose
        run: sudo docker compose -f docker-compose.production.yml config --quiet

      - name: Run clean-host preflight and first deployment
        run: |
          sudo -iu sportsintel -- /opt/sportsintel/app/deploy/linux/preflight.sh "$GITHUB_SHA"
          sudo -iu sportsintel -- /opt/sportsintel/app/deploy/linux/deploy.sh "$GITHUB_SHA"
          sudo -iu sportsintel -- /opt/sportsintel/app/deploy/linux/status.sh
          sudo -iu sportsintel -- /opt/sportsintel/app/deploy/linux/backup.sh

      - name: Configure authenticated HTTPS preview proxy
        run: |
          sudo a2enmod proxy proxy_http headers ssl auth_basic
          sudo htpasswd -bc /etc/apache2/sportsintel-ci.htpasswd preview ci-preview-password
          sudo chmod 640 /etc/apache2/sportsintel-ci.htpasswd
          sudo chown root:www-data /etc/apache2/sportsintel-ci.htpasswd
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=127.0.0.1' \
            -keyout /etc/ssl/private/sportsintel-ci.key \
            -out /etc/ssl/certs/sportsintel-ci.crt
          echo 'Listen 18443' | sudo tee /etc/apache2/conf-available/sportsintel-ci-port.conf >/dev/null
          sudo tee /etc/apache2/sites-available/sportsintel-ci.conf >/dev/null <<'EOF'
          <VirtualHost *:18443>
              ServerName 127.0.0.1
              SSLEngine on
              SSLCertificateFile /etc/ssl/certs/sportsintel-ci.crt
              SSLCertificateKeyFile /etc/ssl/private/sportsintel-ci.key
              ProxyPreserveHost On
              RequestHeader set X-Forwarded-Proto "https"
              <Location />
                  AuthType Basic
                  AuthName "SportsIntel CI Preview"
                  AuthUserFile /etc/apache2/sportsintel-ci.htpasswd
                  Require valid-user
              </Location>
              ProxyPass /api/ http://127.0.0.1:18300/api/
              ProxyPassReverse /api/ http://127.0.0.1:18300/api/
              ProxyPass /health http://127.0.0.1:18300/health
              ProxyPassReverse /health http://127.0.0.1:18300/health
              ProxyPass / http://127.0.0.1:13300/
              ProxyPassReverse / http://127.0.0.1:13300/
          </VirtualHost>
          EOF
          sudo a2enconf sportsintel-ci-port
          sudo a2ensite sportsintel-ci
          sudo apache2ctl configtest
          sudo apache2ctl stop || true
          sudo apache2ctl start

      - name: Verify Basic Auth and authenticated SSR
        env:
          SPORTSINTEL_PUBLIC_URL: https://127.0.0.1:18443
          SPORTSINTEL_PREVIEW_USER: preview
          SPORTSINTEL_PREVIEW_PASSWORD: ci-preview-password
          SPORTSINTEL_SMOKE_INSECURE: "true"
        run: deploy/linux/smoke-test.sh --external

      - name: Ensure internal API hostname is absent from browser assets
        run: |
          sudo docker compose -f docker-compose.production.yml run --rm --no-deps web \
            sh -c "if grep -R 'http://api:8000' /app/.next/static; then echo 'Internal API hostname leaked into browser assets' >&2; exit 1; fi"

      - name: Verify exact reset scope
        run: |
          docker volume create sportsintel-ai_postgres_data
          sudo -iu sportsintel -- /opt/sportsintel/app/deploy/linux/reset-preview.sh --yes
          docker volume inspect sportsintel-ai_postgres_data >/dev/null

      - name: Rehearse first-deploy failure cleanup
        run: |
          metadata_before=$(sha256sum /opt/sportsintel/shared/deployment.json)
          set +e
          sudo -iu sportsintel -- env SPORTSINTEL_TEST_FAIL_PHASE=wait-postgresql \
            /opt/sportsintel/app/deploy/linux/deploy.sh "$GITHUB_SHA"
          result=$?
          set -e
          test "$result" -ne 0
          test ! -e /opt/sportsintel/shared/release.env.candidate
          test "$(sha256sum /opt/sportsintel/shared/deployment.json)" = "$metadata_before"
          test -z "$(sudo docker compose --project-name sportsintel-ci-production --env-file "$SPORTSINTEL_ENV_FILE" -f docker-compose.production.yml ps -q api web)"
          docker volume inspect sportsintel-ai_postgres_data >/dev/null

      - name: Collect production Compose logs on failure
        if: failure()
        run: sudo docker compose -f docker-compose.production.yml logs --no-color

      - name: Tear down production Compose
        if: always()
        run: |
          sudo docker compose -f docker-compose.production.yml down --volumes --remove-orphans || true
          docker volume rm sportsintel-ai_postgres_data 2>/dev/null || true
