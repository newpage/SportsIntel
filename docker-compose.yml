services:
  api:
    build: ./apps/api
    environment:
      YAHOO_NFL_RSS_URL: ${YAHOO_NFL_RSS_URL:-https://sports.yahoo.com/nfl/rss/}
      PREDICTION_HISTORY_FILE: /app/data/prediction_history.json
      NFL_SNAPSHOT_STORE: ${NFL_SNAPSHOT_STORE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sportsintel:sportsintel@postgres:5432/sportsintel}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8300}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsintel}
      POSTGRES_USER: ${POSTGRES_USER:-sportsintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsintel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sportsintel-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    depends_on:
      - api

volumes:
  sportsintel-postgres:
