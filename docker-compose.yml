services:
  api:
    build: ./apps/api
    environment:
      YAHOO_NFL_RSS_URL: ${YAHOO_NFL_RSS_URL:-https://sports.yahoo.com/nfl/rss/}
    ports:
      - "127.0.0.1:${API_PORT:-8300}:8000"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8300}
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    depends_on:
      - api
