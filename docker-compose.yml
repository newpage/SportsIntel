services:
  api:
    build: ./apps/api
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    environment:
      YAHOO_NFL_RSS_URL: ${YAHOO_NFL_RSS_URL:-https://sports.yahoo.com/nfl/rss/}
      PREDICTION_HISTORY_FILE: ${PREDICTION_HISTORY_FILE:-/app/data/prediction_history.json}
      NFL_SNAPSHOT_STORE: ${NFL_SNAPSHOT_STORE:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgresql://sportsintel:sportsintel@postgres:5432/sportsintel}
      SPORTSINTEL_ENV: ${SPORTSINTEL_ENV:-development}
      SPORTSINTEL_ADMIN_KEY: ${SPORTSINTEL_ADMIN_KEY:-}
      SPORTSINTEL_CORS_ORIGINS: ${SPORTSINTEL_CORS_ORIGINS:-}
      SPORTSINTEL_PUBLIC_RATE_LIMIT: ${SPORTSINTEL_PUBLIC_RATE_LIMIT:-60}
      SPORTSINTEL_ADMIN_RATE_LIMIT: ${SPORTSINTEL_ADMIN_RATE_LIMIT:-20}
      SPORTSINTEL_TRUST_PROXY_HEADERS: ${SPORTSINTEL_TRUST_PROXY_HEADERS:-false}
      SPORTSINTEL_VERSION: ${SPORTSINTEL_VERSION:-0.2.0}
      SPORTSINTEL_BUILD_TIMESTAMP: ${SPORTSINTEL_BUILD_TIMESTAMP:-unknown}
      SPORTSINTEL_GIT_COMMIT: ${SPORTSINTEL_GIT_COMMIT:-unknown}
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8300}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sportsintel}
      POSTGRES_USER: ${POSTGRES_USER:-sportsintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsintel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sportsintel-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  web:
    build: ./apps/web
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3300}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/my-picks').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sportsintel-postgres:
